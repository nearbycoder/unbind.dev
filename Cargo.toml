[package]
name = "unbind"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "Share local TCP services over a direct encrypted peer connection"
default-run = "unbind"

[[bin]]
name = "unbind"
path = "src/bin/unbind.rs"
required-features = ["cli"]

[[bin]]
name = "unbind-web"
path = "src/bin/unbind-web.rs"
required-features = ["web"]

[features]
default = ["cli"]
cli = [
    "dep:anyhow", "dep:bytes", "dep:clap", "dep:getrandom",
    "dep:hmac", "dep:reqwest", "dep:serde_json", "dep:sha2", "dep:tokio-util",
    "dep:webrtc", "dep:yamux",
]
web = ["dep:anyhow", "dep:axum", "dep:subtle", "dep:tower-http"]

[dependencies]
anyhow = { version = "1", optional = true }
axum = { version = "0.8", optional = true }
base64 = "0.22"
bytes = { version = "1", optional = true }
clap = { version = "4.5", features = ["derive", "env"], optional = true }
getrandom = { version = "0.3", optional = true }
hmac = { version = "0.12", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", optional = true }
sha2 = { version = "0.10", optional = true }
subtle = { version = "2", optional = true }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat"], optional = true }
tower-http = { version = "0.6", features = ["fs"], optional = true }
webrtc = { version = "0.14", optional = true }
yamux = { version = "0.13", optional = true }

[profile.release]
strip = "symbols"
