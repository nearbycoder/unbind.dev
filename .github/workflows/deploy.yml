name: Deploy Unbind

on:
  push:
    branches: [main]
    tags: ['v[0-9]*']
  workflow_dispatch:
    inputs:
      winget_version:
        description: Published version to validate with WinGet
        required: false
        default: '0.2.0'
        type: string
      desktop_only:
        description: Build and package the desktop app without publishing
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && (inputs.desktop_only && 'unbind-desktop-verification' || 'unbind-winget-verification') || github.ref_type == 'tag' && 'unbind-versioned-release' || 'unbind-production' }}
  queue: max

jobs:
  build:
    name: Build ${{ matrix.platform }} downloads
    if: github.event_name == 'push'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
            targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
          - platform: macos
            runner: macos-15
            targets: x86_64-apple-darwin,aarch64-apple-darwin
          - platform: windows
            runner: ubuntu-24.04
            targets: x86_64-pc-windows-gnu,aarch64-pc-windows-gnullvm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain and targets
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          rustup toolchain install 1.96.1 --profile minimal --target "$TARGETS"
          rustup override set 1.96.1

      - name: Install Zig cross-compiler
        if: matrix.platform != 'macos'
        run: |
          mkdir -p "$RUNNER_TEMP/zig" "$RUNNER_TEMP/zigbuild"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/zig.tar.xz" \
            https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/zigbuild.tar.xz" \
            https://github.com/rust-cross/cargo-zigbuild/releases/download/v0.24.1/cargo-zigbuild-x86_64-unknown-linux-musl.tar.xz
          (
            cd "$RUNNER_TEMP"
            sha256sum --check <<'SUMS'
          02aa270f183da276e5b5920b1dac44a63f1a49e55050ebde3aecc9eb82f93239  zig.tar.xz
          f09b180a517af0e4dd4bffc921bb88e5ab705452a9dd948c61e489b3020c68c2  zigbuild.tar.xz
          SUMS
          )
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          tar -xJf "$RUNNER_TEMP/zigbuild.tar.xz" -C "$RUNNER_TEMP/zigbuild" --strip-components=1
          printf '%s\n' "$RUNNER_TEMP/zig" "$RUNNER_TEMP/zigbuild" >> "$GITHUB_PATH"

      - name: Build release downloads
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          sh scripts/build-downloads.sh "$PLATFORM"
          file dist/unbind-*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unbind-${{ matrix.platform }}
          path: dist/unbind-*
          if-no-files-found: error
          retention-days: 1

  desktop-plan:
    name: Select desktop downloads
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || inputs.desktop_only
    runs-on: ubuntu-24.04
    outputs:
      enabled: ${{ steps.version.outputs.enabled }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the desktop release version
        id: version
        run: |
          python3 - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("Cargo.toml").read_text())["package"]["version"]
          if not re.fullmatch(r"(?:0|[1-9][0-9]*)(?:\.(?:0|[1-9][0-9]*)){2}", version):
              raise SystemExit("Expected a stable desktop version such as 0.3.0")
          manual = os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch"
          if not manual and os.environ["GITHUB_REF_NAME"] != f"v{version}":
              raise SystemExit(f"Release tag must match Cargo.toml version v{version}")
          enabled = manual or tuple(map(int, version.split("."))) >= (0, 3, 0)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"enabled={str(enabled).lower()}", f"version={version}", sep="\n", file=output)
          PY

  desktop-build:
    name: Build desktop ${{ matrix.platform }} ${{ matrix.architecture }}
    needs: desktop-plan
    if: needs.desktop-plan.outputs.enabled == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      DESKTOP_TARGET: ${{ matrix.target }}
      DESKTOP_PLATFORM: ${{ matrix.platform }}
      DESKTOP_ARCH: ${{ matrix.architecture }}
      DESKTOP_VERSION: ${{ needs.desktop-plan.outputs.version }}
      DESKTOP_RUST: '1.99.1'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            architecture: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - platform: linux
            architecture: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - platform: darwin
            architecture: amd64
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - platform: darwin
            architecture: arm64
            runner: macos-15
            target: aarch64-apple-darwin
          - platform: windows
            architecture: amd64
            runner: windows-2025
            target: x86_64-pc-windows-msvc
          - platform: windows
            architecture: arm64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the desktop Rust toolchain
        shell: bash
        run: rustup toolchain install "$DESKTOP_RUST-$DESKTOP_TARGET" --profile minimal

      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev libxkbcommon-x11-0

      - name: Build the desktop executable on Linux or macOS
        if: runner.os != 'Windows'
        shell: bash
        env:
          MACOSX_DEPLOYMENT_TARGET: '13.0'
        run: |
          cargo "+$DESKTOP_RUST-$DESKTOP_TARGET" build --locked --release \
            --no-default-features --features desktop --bin unbind-desktop --target "$DESKTOP_TARGET"

      - name: Build the Windows desktop executable with the Unbind icon
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          RUSTFLAGS: '-C target-feature=+crt-static'
        run: |
          $sdk = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $versions = Get-ChildItem -LiteralPath $sdk -Directory |
            Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
            Sort-Object { [version]$_.Name } -Descending
          $hostArchitectures = if ($env:DESKTOP_ARCH -eq 'arm64') { 'arm64', 'x64' } else { 'x64' }
          $resourceCompiler = $versions | ForEach-Object {
            foreach ($architecture in $hostArchitectures) {
              Get-Item -LiteralPath (Join-Path $_.FullName "$architecture\rc.exe") -ErrorAction SilentlyContinue
            }
          } | Select-Object -First 1
          if (!$resourceCompiler) { throw 'Windows SDK resource compiler is unavailable.' }
          $source = Join-Path $env:RUNNER_TEMP 'Unbind.rc'
          $resource = Join-Path $env:RUNNER_TEMP 'Unbind.res'
          '1 ICON "icon.ico"' | Set-Content -LiteralPath $source -Encoding ascii
          & $resourceCompiler.FullName /nologo /fo $resource /I (Join-Path $PWD 'assets') $source
          if ($LASTEXITCODE -ne 0) { throw 'Compiling the Windows icon failed.' }
          cargo "+$env:DESKTOP_RUST-$env:DESKTOP_TARGET" rustc --locked --release `
            --no-default-features --features desktop --bin unbind-desktop --target "$env:DESKTOP_TARGET" `
            -- -C "link-arg=$resource"
          if ($LASTEXITCODE -ne 0) { throw 'Building Unbind Desktop failed.' }

      - name: Verify and package the desktop executable
        shell: pwsh
        run: |
          $fileName = if ($IsWindows) { 'unbind-desktop.exe' } else { 'unbind-desktop' }
          $python = if ($IsWindows) { 'python' } else { 'python3' }
          $binary = Join-Path $PWD "target/$env:DESKTOP_TARGET/release/$fileName"
          $versionFile = Join-Path $env:RUNNER_TEMP 'desktop-version.txt'
          $process = Start-Process -FilePath $binary -ArgumentList '--version' -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput $versionFile
          $version = (Get-Content -LiteralPath $versionFile -Raw).Trim()
          if ($process.ExitCode -ne 0 -or ($version -split '\s+')[-1] -ne $env:DESKTOP_VERSION) {
            throw "Expected Unbind Desktop $env:DESKTOP_VERSION from $binary, got: $version"
          }
          & $python scripts/package-desktop.py $env:DESKTOP_PLATFORM $env:DESKTOP_ARCH `
            $env:DESKTOP_VERSION $binary desktop-dist
          if ($LASTEXITCODE -ne 0) { throw 'Packaging Unbind Desktop failed.' }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.architecture }}
          path: desktop-dist/unbind-desktop-*
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to Railway
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: unbind-*
          merge-multiple: true
          path: dist

      - name: Check the six release binaries
        working-directory: dist
        run: |
          for name in unbind-linux-amd64 unbind-linux-arm64 unbind-darwin-amd64 \
            unbind-darwin-arm64 unbind-windows-amd64.exe unbind-windows-arm64.exe; do
            test -s "$name"
          done
          sha256sum unbind-* > SHA256SUMS

      - name: Install Railway CLI
        run: |
          npm install --prefix "$RUNNER_TEMP/railway-cli" @railway/cli@5.62.1
          printf '%s\n' "$RUNNER_TEMP/railway-cli/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Deploy the current commit
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
          RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
        run: |
          : "${RAILWAY_TOKEN:?Set the RAILWAY_TOKEN Actions secret}"
          : "${RAILWAY_PROJECT_ID:?Set the RAILWAY_PROJECT_ID Actions variable}"
          : "${RAILWAY_ENVIRONMENT_ID:?Set the RAILWAY_ENVIRONMENT_ID Actions variable}"
          : "${RAILWAY_SERVICE_ID:?Set the RAILWAY_SERVICE_ID Actions variable}"
          railway up --yes --no-gitignore --ci \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT_ID" \
            --service "$RAILWAY_SERVICE_ID" \
            --message "Deploy ${GITHUB_SHA}"

      - name: Verify production and published downloads
        run: |
          curl -fsS --retry 5 --max-time 15 https://unbind.dev/healthz | grep -Fx ok
          curl -fsS --retry 5 --max-time 15 https://unbind.dev/downloads/SHA256SUMS \
            | diff -u dist/SHA256SUMS -

      - name: Test the installed binary checksum
        shell: bash
        run: |
          UNBIND_BIN_DIR="$(mktemp -d)"
          export UNBIND_BIN_DIR
          trap 'rm -rf "$UNBIND_BIN_DIR"' EXIT

          curl -fsS --retry 5 --max-time 15 https://unbind.dev/install.sh | cmp site/install.sh -
          sh site/install.sh
          sh site/install.sh --verify

          printf '\nchecksum test\n' >> "$UNBIND_BIN_DIR/unbind"
          if result=$(sh site/install.sh --verify 2>&1); then
            echo 'The installer accepted a modified executable.' >&2
            exit 1
          fi
          printf '%s\n' "$result" | grep -F 'Checksum mismatch'

  release:
    name: Publish signed version
    if: >-
      always() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') &&
      needs.build.result == 'success' && needs.desktop-plan.result == 'success' &&
      (needs.desktop-plan.outputs.enabled == 'false' || needs.desktop-build.result == 'success')
    needs: [build, desktop-plan, desktop-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: unbind-*
          merge-multiple: true
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.desktop-plan.outputs.enabled == 'true'
        with:
          pattern: desktop-*
          merge-multiple: true
          path: dist

      - name: Prepare versioned assets
        shell: bash
        run: |
          version=$(python3 -c 'from pathlib import Path; import tomllib; print(tomllib.loads(Path("Cargo.toml").read_text())["package"]["version"])')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Release tag $GITHUB_REF_NAME must match Cargo.toml version v$version" >&2
            exit 1
          fi
          python3 scripts/package-release.py "$version" dist
          (cd dist && sha256sum --check SHA256SUMS)

      - name: Record checksums for the desktop downloads
        if: needs.desktop-plan.outputs.enabled == 'true'
        working-directory: dist
        shell: bash
        run: |
          packages=(unbind-desktop-darwin-{amd64,arm64}.zip
                    unbind-desktop-linux-{amd64,arm64}.tar.gz
                    unbind-desktop-windows-{amd64,arm64}.zip)
          sha256sum "${packages[@]}" > unbind-desktop-SHA256SUMS

      - name: Sign the release manifest
        shell: bash
        env:
          UNBIND_RELEASE_SIGNING_KEY: ${{ secrets.UNBIND_RELEASE_SIGNING_KEY }}
        run: |
          : "${UNBIND_RELEASE_SIGNING_KEY:?Configure the Unbind release signing key}"
          umask 077
          key_dir=$(mktemp -d)
          trap 'rm -rf "$key_dir"' EXIT
          printf '%s\n' "$UNBIND_RELEASE_SIGNING_KEY" > "$key_dir/private.pem"
          openssl pkey -in "$key_dir/private.pem" -pubout -out "$key_dir/public.pem"
          actual_key=$(openssl pkey -pubin -in "$key_dir/public.pem" -outform DER \
            | tail -c 32 | od -An -v -tx1 | tr -d '[:space:]')
          if [ "$actual_key" != "$(tr -d '[:space:]' < release/public-key.hex)" ]; then
            echo 'The signing key does not match the public key pinned in Unbind.' >&2
            exit 1
          fi
          manifests=(dist/release.json)
          if [ -f dist/unbind-desktop-SHA256SUMS ]; then
            manifests+=(dist/unbind-desktop-SHA256SUMS)
          fi
          for manifest in "${manifests[@]}"; do
            openssl pkeyutl -sign -inkey "$key_dir/private.pem" -rawin \
              -in "$manifest" -out "$manifest.sig"
            openssl pkeyutl -verify -pubin -inkey "$key_dir/public.pem" -rawin \
              -in "$manifest" -sigfile "$manifest.sig"
          done

      - name: Wait for the public version route
        shell: bash
        run: |
          url="https://unbind.dev/downloads/releases/${GITHUB_REF_NAME#v}/release.json"
          expected="307 https://github.com/nearbycoder/unbind.dev/releases/download/$GITHUB_REF_NAME/release.json"
          deadline=$((SECONDS + 170))
          while (( SECONDS < deadline )); do
            if route=$(curl -sS --max-time 5 --output /dev/null --write-out '%{http_code} %{redirect_url}' "$url") &&
              [ "$route" = "$expected" ]; then
              exit 0
            fi
            sleep 10
          done
          echo "The versioned download route is unavailable at $url." >&2
          exit 1

      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if draft=$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft); then
            if [ "$draft" != true ]; then
              echo "Release $GITHUB_REF_NAME is already published." >&2
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft \
              --title "Unbind $GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false

      - name: Verify the public versioned downloads
        shell: bash
        run: |
          artifacts=(release.json release.json.sig SHA256SUMS unbind.rb unbind.json unbind-winget.zip)
          if [ -f dist/unbind-desktop-SHA256SUMS ]; then
            artifacts+=(unbind-desktop-SHA256SUMS unbind-desktop-SHA256SUMS.sig)
          fi
          for artifact in "${artifacts[@]}"; do
            curl -fsSL --retry 10 --retry-all-errors --retry-delay 2 --max-time 18 \
              "https://unbind.dev/downloads/releases/${GITHUB_REF_NAME#v}/$artifact" | cmp "dist/$artifact" -
          done

  winget:
    name: Validate and install the WinGet package
    if: always() && ((github.event_name == 'workflow_dispatch' && !inputs.desktop_only) || (startsWith(github.ref, 'refs/tags/v') && needs.release.result == 'success'))
    needs: release
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Prepare a current WinGet client
        shell: pwsh
        run: |
          $installed = [version]'0.0'
          if (Get-Command winget.exe -ErrorAction SilentlyContinue) {
            $reported = (winget --version).Trim().TrimStart('v')
            if ($reported -match '^\d+\.\d+\.\d+$') { $installed = [version]$reported }
          }
          if ($installed -lt [version]'1.28') {
            Install-Module Microsoft.WinGet.Client -Repository PSGallery -Force -Scope CurrentUser
            Repair-WinGetPackageManager -Force -Latest
            Join-Path $env:LOCALAPPDATA 'Microsoft\WindowsApps' >> $env:GITHUB_PATH
          }

      - name: Validate and install the published manifests
        shell: pwsh
        env:
          UNBIND_RELEASE_REF: ${{ inputs.winget_version || github.ref_name }}
        run: |
          $version = $env:UNBIND_RELEASE_REF -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Expected a stable version such as 0.2.0.' }
          winget --version
          $bundle = Join-Path $env:RUNNER_TEMP 'unbind-winget.zip'
          $manifests = Join-Path $env:RUNNER_TEMP 'unbind-winget'
          Invoke-WebRequest "https://unbind.dev/downloads/releases/$version/unbind-winget.zip" -OutFile $bundle
          Expand-Archive $bundle -DestinationPath $manifests
          winget validate --manifest "$manifests"
          if ($LASTEXITCODE -ne 0) { throw 'WinGet manifest validation failed.' }
          winget settings --enable LocalManifestFiles
          if ($LASTEXITCODE -ne 0) { throw 'Could not enable local WinGet manifests.' }
          winget install --manifest "$manifests" --scope user --silent --disable-interactivity --accept-package-agreements --accept-source-agreements
          if ($LASTEXITCODE -ne 0) { throw 'WinGet installation failed.' }
          $installed = Join-Path $env:LOCALAPPDATA 'Microsoft\WinGet\Links\unbind.exe'
          if ((& $installed --version) -ne "unbind $version") { throw 'Unexpected installed Unbind version.' }
